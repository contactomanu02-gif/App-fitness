name: Cambiar subdominio de Cloudflare
# Se corre a mano. Cambia <subdominio>.workers.dev de la cuenta de Cloudflare.
on:
  workflow_dispatch:
    inputs:
      subdominio:
        description: Nuevo subdominio (queda <app>.<subdominio>.workers.dev)
        required: true
        default: fitnessapproach
jobs:
  cambiar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f68bc8e18b4a1b34a419652c4c64dcc8' }}
    steps:
      - name: Subdominio actual
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq '{success, result, errors}'
      - name: Cambiar
        run: |
          r=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d "{\"subdomain\": \"${{ inputs.subdominio }}\"}")
          echo "$r" | jq '{success, result, errors}'
          echo "$r" | jq -e '.success == true' > /dev/null
