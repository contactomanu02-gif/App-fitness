# Latido diario: mantiene todo andando aunque nadie toque el código por meses.
# - Supabase (plan gratis) pausa los proyectos sin uso por una semana: acá se usa la base
#   todos los días y, si igual estuviera pausada, se la reactiva y se avisa (falla en rojo).
# - GitHub apaga las tareas programadas (como el respaldo diario) si el repositorio no tiene
#   cambios en 60 días: acá se vuelven a encender todos los días.
name: Latido diario

on:
  schedule:
    - cron: "41 11 * * *" # 8:41 en Argentina
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  SUPABASE_PROJECT_ID: jixprysxcuyzpvreohgi
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  APP_URL: https://app.fitness-approach-app.workers.dev

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mantener encendidas las tareas programadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in respaldo.yml latido.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" >/dev/null 2>&1 \
              && echo "Encendida: $wf" || echo "No existe o no se pudo: $wf"
          done

      - name: Supabase activo (y reactivarlo si se pausó)
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID"
          estado=$(curl -sS -f "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r .status)
          echo "Estado de Supabase: $estado"
          if [ "$estado" = "INACTIVE" ] || [ "$estado" = "PAUSED" ]; then
            curl -sS -f -X POST "$api/restore" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" || true
            echo "::error::Supabase estaba pausado. Se pidió reactivarlo; revisá la app en unos minutos."
            exit 1
          fi
          keys=$(curl -sS -f "$api/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          anon=$(echo "$keys" | jq -r '.[] | select(.name=="anon") | .api_key')
          echo "::add-mask::$anon"
          # Consultas reales a la base (cuentan como uso).
          curl -sS -f -o /dev/null "https://$SUPABASE_PROJECT_ID.supabase.co/rest/v1/sports?select=id&limit=1" \
            -H "apikey: $anon" -H "Authorization: Bearer $anon"
          jq -n '{query: "select count(*) as alumnos from public.athletes"}' > body.json
          curl -sS -f -X POST "$api/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" --data @body.json | jq -c .

      - name: La app responde
        run: |
          for p in / /ingresar; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL$p")
            echo "$p → $code"
            [ "$code" = "200" ] || { echo "::error::La app no respondió bien en $p ($code)"; exit 1; }
          done
