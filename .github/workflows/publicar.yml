# Publica la app cada vez que se guarda código en main (o a mano desde la pestaña Actions).
# 1) Aplica los cambios de base de datos en Supabase.
# 2) Si Cloudflare ya está configurado, construye y publica la app.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: jixprysxcuyzpvreohgi
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Revisar secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltan los secretos SUPABASE_ACCESS_TOKEN y/o SUPABASE_DB_PASSWORD en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Aplicar cambios de base de datos
        run: supabase db push --linked --include-all

  app:
    needs: base-de-datos
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: ¿Cloudflare configurado?
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare todavía no está configurado: se publica solo la base de datos."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cf.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cf.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        if: steps.cf.outputs.ready == 'true'
        with:
          version: latest
      - name: Claves del proyecto Supabase
        if: steps.cf.outputs.ready == 'true'
        run: |
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --reveal -o json 2>/dev/null || supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json)
          anon=$(echo "$keys" | jq -r '.[] | select(.name=="anon") | .api_key')
          service=$(echo "$keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$anon" ] || [ -z "$service" ]; then echo "::error::No se pudieron leer las claves de Supabase."; exit 1; fi
          echo "::add-mask::$service"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"
          echo "SERVICE_ROLE_KEY=$service" >> "$GITHUB_ENV"
      - name: Instalar dependencias
        if: steps.cf.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Construir
        if: steps.cf.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npx opennextjs-cloudflare build
      - name: Publicar en Cloudflare
        if: steps.cf.outputs.ready == 'true'
        run: |
          npx wrangler deploy \
            --var NEXT_PUBLIC_SITE_URL:"${SITE_URL}" \
            --var COACH_SIGNUP_ENABLED:"${{ vars.COACH_SIGNUP_ENABLED || 'true' }}" \
            --var EMAIL_FROM:"${{ vars.EMAIL_FROM }}"
          echo "$SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY; fi
      - name: Direcciones permitidas para los emails de acceso
        if: steps.cf.outputs.ready == 'true' && env.SITE_URL != ''
        run: |
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\": \"$SITE_URL\", \"uri_allow_list\": \"$SITE_URL/**\"}" > /dev/null
