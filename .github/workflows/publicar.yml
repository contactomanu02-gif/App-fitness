# Publica la app cada vez que se guarda código en main (o a mano desde la pestaña Actions).
# 0) Corre TODAS las pruebas (incluida la app instalada en iPhone). Si alguna falla, no se publica nada.
# 1) Aplica los cambios de base de datos en Supabase.
# 2) Si Cloudflare ya está configurado, construye y publica la app.
# 3) Prueba la app publicada en iPhone/Android; si falla, vuelve sola a la versión anterior.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: jixprysxcuyzpvreohgi
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  pruebas:
    uses: ./.github/workflows/pruebas.yml

  base-de-datos:
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Revisar secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltan los secretos SUPABASE_ACCESS_TOKEN y/o SUPABASE_DB_PASSWORD en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Aplicar cambios de base de datos
        run: supabase db push --remote --include-all --yes

  app:
    needs: base-de-datos
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f68bc8e18b4a1b34a419652c4c64dcc8' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://app.fitness-approach-app.workers.dev' }}
    steps:
      - name: ¿Cloudflare configurado?
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare todavía no está configurado: se publica solo la base de datos."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cf.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cf.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        if: steps.cf.outputs.ready == 'true'
        with:
          version: 3.4.0
      - name: Claves del proyecto Supabase
        if: steps.cf.outputs.ready == 'true'
        run: |
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --reveal -o json 2>/dev/null || supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json)
          anon=$(echo "$keys" | jq -r '.[] | select(.name=="anon") | .api_key')
          service=$(echo "$keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$anon" ] || [ -z "$service" ]; then echo "::error::No se pudieron leer las claves de Supabase."; exit 1; fi
          echo "::add-mask::$service"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"
          echo "SERVICE_ROLE_KEY=$service" >> "$GITHUB_ENV"
      - name: Instalar dependencias
        if: steps.cf.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Construir
        if: steps.cf.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://app.fitness-approach-app.workers.dev' }}
        run: npx opennextjs-cloudflare build
      - name: Versión publicada ahora (para volver atrás si hace falta)
        if: steps.cf.outputs.ready == 'true'
        run: |
          prev=$(npx wrangler deployments status --json 2>/dev/null | jq -r '[.. | .version_id? // empty][0] // empty' || true)
          echo "Versión anterior: ${prev:-ninguna}"
          echo "PREV_VERSION=$prev" >> "$GITHUB_ENV"
      - name: Publicar en Cloudflare
        if: steps.cf.outputs.ready == 'true'
        run: |
          # Código y claves en una sola versión (así se puede volver atrás de una).
          jq -n --arg s "$SERVICE_ROLE_KEY" --arg r "${{ secrets.RESEND_API_KEY }}" \
            '{SUPABASE_SERVICE_ROLE_KEY: $s} + (if $r != "" then {RESEND_API_KEY: $r} else {} end)' > /tmp/secrets.json
          npx wrangler deploy --secrets-file /tmp/secrets.json \
            --var NEXT_PUBLIC_SITE_URL:"${SITE_URL}" \
            --var COACH_SIGNUP_ENABLED:"${{ vars.COACH_SIGNUP_ENABLED || 'false' }}" \
            --var EMAIL_FROM:"${{ vars.EMAIL_FROM }}"
          rm -f /tmp/secrets.json
      - name: Direcciones permitidas para los emails de acceso
        if: steps.cf.outputs.ready == 'true' && env.SITE_URL != ''
        run: |
          curl -sf -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\": \"$SITE_URL\", \"uri_allow_list\": \"$SITE_URL/**\", \"mailer_otp_exp\": 86400}" > /dev/null
      - name: Dirección de la app para los avisos diarios
        if: steps.cf.outputs.ready == 'true' && env.SITE_URL != ''
        run: |
          q=$(jq -n --arg u "$SITE_URL" '{query: ("update public.app_secrets set value = " + ($u | @json | sub("^\"";"'"'"'") | sub("\"$";"'"'"'")) + " where key = '"'"'site_url'"'"';")}')
          curl -sf -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$q" > /dev/null \
            || echo "::warning::No se pudo actualizar la dirección de los avisos."
      - name: Comprobar que la app responde
        if: steps.cf.outputs.ready == 'true'
        run: |
          sleep 5
          # Calentar la versión nueva de a una página por vez: el primer pedido de cada sección es el que más
          # cálculo usa, y así no le toca a un alumno (ni se juntan varios a la vez, que es lo que dio el error 1102).
          for p in / /ingresar /acceso/alumno /acceso/entrenador /unirme /app /panel /app/calendario /app/progreso /panel/alumnos; do
            curl -s -o /dev/null "$SITE_URL$p" || true; sleep 1
          done
          for p in / /ingresar /offline.html /sw.js /manifest.webmanifest; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$SITE_URL$p")
            echo "$p → $code"
            [ "$code" = "200" ] || { echo "::error::La app no respondió bien en $p"; exit 1; }
          done
      - name: Probar la app publicada en iPhone y Android (service worker + redirecciones)
        if: steps.cf.outputs.ready == 'true'
        env:
          BASE_URL: ${{ env.SITE_URL }}
        run: |
          npx playwright install --with-deps chromium webkit > /dev/null
          npx playwright test --config e2e-pwa/playwright.config.ts --grep-invert "con sesión" --trace off
      - name: Si la app publicada falla, volver a la versión anterior
        if: failure() && steps.cf.outputs.ready == 'true' && env.PREV_VERSION != ''
        run: |
          npx wrangler rollback "$PREV_VERSION" -y -m "Vuelta atrás automática: fallaron las pruebas de la app publicada"
          echo "::error::La versión nueva falló en la app publicada y se volvió automáticamente a la anterior."
